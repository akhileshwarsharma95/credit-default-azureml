name: batch-scoring-and-monitoring
on:
  workflow_dispatch:
    inputs:
      batch:
        description: Demo batch to score
        type: choice
        options: [portfolio_downturn, portfolio_stable]
        default: portfolio_downturn
permissions:
  id-token: write
  contents: read
env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZUREML_WORKSPACE: ${{ vars.AZUREML_WORKSPACE }}
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: uv sync --locked
      - run: uv run python scripts/download_data.py && uv run python scripts/make_batches.py
      - run: uv run python pipeline/run_batch_pipeline.py --batch "data/batches/${{ inputs.batch }}.csv" --wait
