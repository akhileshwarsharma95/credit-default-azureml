name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Format and lint
        run: uv run ruff format --check . && uv run ruff check .
      - name: Tests (unit + end-to-end pipeline on synthetic data, local MLflow registry)
        run: uv run pytest -q
      - name: Validate Azure ML specs (pipelines, endpoint, monitor) - no Azure access needed
        run: |
          uv run python pipeline/run_pipeline.py --dry-run > /dev/null
          uv run python pipeline/run_batch_pipeline.py --dry-run > /dev/null
          uv run python deploy/deploy_endpoint.py --dry-run > /dev/null
          uv run python monitoring/setup_model_monitor.py --dry-run > /dev/null
