[project]
name = "credit-default-azureml"
version = "1.0.0"
description = "Credit default (PD) engine on Azure ML: pipeline, monitoring, explainability, app"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 160
target-version = "py310"
extend-exclude = ["outputs", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007", "B905", "E702", "UP038"]

[tool.ruff.lint.isort]
known-first-party = ["creditrisk", "conftest", "azure_utils", "deploy_endpoint"]
