[project]
name = "credit-default-azureml"
version = "1.0.0"
description = "Credit default (PD) engine on Azure ML: pipeline, monitoring, explainability, app"
requires-python = ">=3.10"
# Pipeline steps and the creditrisk library. Same pins as the Azure job environment (environments/conda.yaml).
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scipy==1.14.1",
    "scikit-learn==1.5.2",
    "lightgbm==4.5.0",
    "optuna==4.1.0",
    "shap==0.47.2",
    "numba==0.61.2",
    "pandera==0.21.1",
    "multimethod==1.12",
    "duckdb==1.1.3",
    "matplotlib==3.9.2",
    "mlflow==2.19.0",
    "sqlalchemy==2.0.36",
    "xlrd==2.0.1",
    "openpyxl==3.1.5",
]

[dependency-groups]
azure = ["azure-ai-ml==1.35.2", "azure-identity==1.27.0", "azureml-mlflow==1.60.0.post1"]
app = ["streamlit==1.65.0", "plotly==7.1.0", "openai==1.109.1", "azure-monitor-opentelemetry==1.8.11"]
dev = ["ruff==0.8.4", "pytest==8.3.4"]

[tool.uv]
default-groups = ["azure", "app", "dev"]
exclude-newer = "2026-10-27T19:32:00Z"  # resolve transitive packages as of the tested lock
# Transitive versions of the tested lock that are older than the newest release before that date
constraint-dependencies = [
    "altair==6.2.2", "asgiref==3.12.1", "contourpy==1.3.2", "fonttools==4.65.0",
    "markdown==3.10.3", "pycparser==3.11", "rpds-py==0.30.0", "starlette==1.7.0", "websockets==16.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creditrisk", "pipeline", "deploy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 160
target-version = "py310"
extend-exclude = ["outputs", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007", "B905", "E702", "UP038"]

[tool.ruff.lint.isort]
known-first-party = ["creditrisk", "conftest", "azure_utils", "deploy_endpoint"]
